<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff12"/>
      <stop offset="100%" stop-color="#ffffff06"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff00"/>
      <stop offset="50%" stop-color="#ffffff15"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="12" fill="#080808"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0; 0,8; 0,0" dur="6s" repeatCount="indefinite"/>
    <g transform="translate(60, 38)">
      <rect x="0" y="0" width="180" height="124" rx="10" fill="url(#glass)" stroke="#ffffff20" stroke-width="0.8"/>
      <rect x="0" y="0" width="180" height="124" rx="10" fill="#ffffff04"/>
      <rect x="14" y="14" width="90" height="6" rx="3" fill="#ffffff25"/>
      <rect x="14" y="28" width="70" height="5" rx="2.5" fill="#ffffff12"/>
      <rect x="14" y="40" width="80" height="5" rx="2.5" fill="#ffffff12"/>
      <rect x="14" y="52" width="60" height="5" rx="2.5" fill="#ffffff12"/>
      <rect x="14" y="62" width="152" height="0.5" fill="#ffffff10"/>
      <rect x="14" y="72" width="75" height="5" rx="2.5" fill="#ffffff10"/>
      <rect x="98" y="72" width="60" height="5" rx="2.5" fill="#ffffff10"/>
      <rect x="14" y="86" width="50" height="5" rx="2.5" fill="#ffffff10"/>
      <rect x="14" y="96" width="152" height="0.5" fill="#ffffff10"/>
      <rect x="14" y="106" width="152" height="8" rx="4" fill="#ffffff08"/>
      <rect x="140" y="106" width="26" height="8" rx="4" fill="#ffffff15"/>
    </g>
  </g>
  <text x="275" y="66" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#f0f0f0">Nilesoft Shell GUI</text>
  <text x="275" y="92" font-family="Segoe UI, sans-serif" font-size="13" fill="#666680">Visual editor for Windows context menu config files</text>
